<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TURZX ESP32</title>
  <style>
    :root {
      --bg: #0b1220;
      --panel: #152238;
      --text: #e8eef8;
      --muted: #93a4bd;
      --accent: #2ec5ff;
      --ok: #3ddc97;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(circle at top left, #173452, var(--bg));
      color: var(--text);
      min-height: 100vh;
      padding: 24px;
    }
    h1 { margin: 0 0 8px; letter-spacing: 0.04em; }
    .sub { color: var(--muted); margin-bottom: 24px; }
    .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
    section {
      background: color-mix(in srgb, var(--panel) 90%, black);
      border: 1px solid #2a3f5f;
      border-radius: 12px;
      padding: 16px;
    }
    label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
    input, button, select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #314868;
      background: #0f1a2b;
      color: var(--text);
    }
    button {
      margin-top: 14px;
      background: var(--accent);
      color: #041018;
      border: none;
      font-weight: 700;
      cursor: pointer;
    }
    button.secondary { background: #2a3f5f; color: var(--text); }
    .status {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      background: #1d3b2c;
      color: var(--ok);
      font-size: 12px;
    }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  </style>
</head>
<body>
  <h1>TURZX Dashboard</h1>
  <p class="sub">ESP32-S3 config · <span id="fw"></span> · <span class="status" id="status">…</span></p>

  <div class="grid">
    <section>
      <h2>WiFi</h2>
      <label>SSID</label>
      <input id="wifiSsid" />
      <label>Password</label>
      <input id="wifiPassword" type="password" placeholder="unchanged if blank" />
    </section>

    <section>
      <h2>MQTT / Home Assistant</h2>
      <label>Broker host</label>
      <input id="mqttHost" />
      <div class="row">
        <div>
          <label>Port</label>
          <input id="mqttPort" type="number" />
        </div>
        <div>
          <label>Client ID</label>
          <input id="mqttClientId" />
        </div>
      </div>
      <label>Username</label>
      <input id="mqttUser" />
      <label>Password</label>
      <input id="mqttPassword" type="password" placeholder="unchanged if blank" />
    </section>

    <section>
      <h2>Display</h2>
      <label>Brightness (0-100)</label>
      <input id="brightness" type="number" min="0" max="100" />
      <label>Orientation</label>
      <select id="orientation">
        <option value="1">Landscape (1920×480)</option>
        <option value="0">Portrait (480×1920)</option>
      </select>
      <button class="secondary" id="applyBrightness">Apply brightness now</button>
    </section>

    <section>
      <h2>Widgets (MQTT topics)</h2>
      <div id="widgets"></div>
    </section>
  </div>

  <button id="save">Save configuration</button>
  <button class="secondary" id="ota" onclick="location.href='/update'">Upload firmware (OTA)</button>

  <script>
    const fields = [
      "wifiSsid", "mqttHost", "mqttPort", "mqttUser", "mqttClientId",
      "brightness", "orientation"
    ];

    function widgetHtml(i, label, topic) {
      return `
        <label>Label ${i + 1}</label>
        <input data-label="${i}" value="${label || ""}" />
        <label>Topic ${i + 1}</label>
        <input data-topic="${i}" value="${topic || ""}" />
      `;
    }

    async function load() {
      const status = await fetch("/api/status").then(r => r.json());
      document.getElementById("status").textContent = status.status + " @ " + status.ip;
      document.getElementById("fw").textContent = "v" + status.firmware;
      const cfg = await fetch("/api/config").then(r => r.json());
      fields.forEach(k => {
        if (cfg[k] !== undefined) document.getElementById(k).value = cfg[k];
      });
      const box = document.getElementById("widgets");
      box.innerHTML = "";
      for (let i = 0; i < 6; i++) {
        box.innerHTML += widgetHtml(i, (cfg.widgetLabels || [])[i], (cfg.widgetTopics || [])[i]);
      }
    }

    document.getElementById("save").onclick = async () => {
      const body = {};
      fields.forEach(k => body[k] = document.getElementById(k).value);
      body.mqttPort = Number(body.mqttPort);
      body.brightness = Number(body.brightness);
      body.orientation = Number(body.orientation);
      const pass = document.getElementById("wifiPassword").value;
      const mqttPass = document.getElementById("mqttPassword").value;
      if (pass) body.wifiPassword = pass;
      if (mqttPass) body.mqttPassword = mqttPass;
      body.widgetLabels = [...document.querySelectorAll("[data-label]")].map(el => el.value);
      body.widgetTopics = [...document.querySelectorAll("[data-topic]")].map(el => el.value);
      body.haDiscovery = true;
      const res = await fetch("/api/config", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });
      document.getElementById("status").textContent = res.ok ? "saved" : "save failed";
    };

    document.getElementById("applyBrightness").onclick = async () => {
      const value = document.getElementById("brightness").value;
      const form = new URLSearchParams({ value });
      await fetch("/api/brightness", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: form
      });
    };

    load();
  </script>
</body>
</html>
