; ESP32-S3 + TURZX 8.8" Rev C
;
; Recommended permanent wiring (no cable swap):
;   Mac ──────── USB-UART (CH343)     flash + serial forever
;   Panel ────── USB-OTG (native)     USB host forever
;   Panel PSU ── panel's 2nd USB-C    5V (DevKit OTG often has no VBUS)
;
; Fallback when UART won't flash: env esp32-s3-otg, then use OTA / WebUI.

[platformio]
default_envs = esp32-s3

; Once on WiFi: pio run -e esp32-s3-ota -t upload --upload-port <ip>
[env:esp32-s3-ota]
extends = common
upload_protocol = espota
build_flags =
  ${common.build_flags}
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DTURZX_LOG_UART=1

[common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.filesystem = littlefs
board_build.partitions = default.csv
board_build.psram = enabled
board_build.cmake_extra_args =
  -DSDKCONFIG_DEFAULTS=${PROJECT_DIR}/sdkconfig.defaults
lib_deps =
  bblanchon/ArduinoJson @ ^7.2.1
  knolleary/PubSubClient @ ^2.8
lib_ignore =
  AsyncTCP_RP2040W
build_flags =
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=3
  -DFIRMWARE_VERSION=\"1.2.20\"
  -DTURZX_USE_UART=0
  -DTURZX_UART_RX=44
  -DTURZX_UART_TX=43
  -DTURZX_UART_BAUD=115200
  -Iinclude
  -Ilib/usb_host_cdc_acm/private_include
  -Ilib/usb_host_cdc_acm/include
  -Ithird_party/esp-idf-v5.5.5-usb/private_include

; ── Default: USB-UART (CH343 = cu.usbmodem*, VID 1A86:55D3) ─────────────
[env:esp32-s3]
extends = common
; Slow + no-stub: CH343 often 0105s at high baud after erase
upload_speed = 115200
upload_protocol = esptool
upload_flags =
  --no-stub
  --before=default_reset
  --after=hard_reset
monitor_rts = 0
monitor_dtr = 0
build_flags =
  ${common.build_flags}
  ; Serial = UART0 (CH343). Native USB PHY free for USB host.
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DTURZX_LOG_UART=1

; ── Fallback: Espressif native USB-Serial/JTAG on the OTG connector ─────
[env:esp32-s3-otg]
extends = common
upload_speed = 115200
upload_protocol = esptool
upload_flags =
  --no-stub
  --before=default_reset
  --after=hard_reset
build_flags =
  ${common.build_flags}
  ; Boot logs on OTG for ~20s, then USB host claims the PHY
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DTURZX_LOG_UART=0
